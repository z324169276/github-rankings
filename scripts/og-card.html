<!doctype html>
<!-- 站点分享缩略图的源文件：用 headless 浏览器截成 1200×630 的 public/og.png -->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #06070a;
    color: #f5f5f7;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    position: relative;
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); }
  .orb-a { width: 620px; height: 620px; top: -240px; left: -160px; background: radial-gradient(circle, #0a84ff 0%, transparent 70%); opacity: .55; }
  .orb-b { width: 560px; height: 560px; top: -60px; right: -180px; background: radial-gradient(circle, #bf5af2 0%, transparent 70%); opacity: .45; }
  .orb-c { width: 520px; height: 520px; bottom: -260px; left: 34%; background: radial-gradient(circle, #ff375f 0%, transparent 70%); opacity: .28; }

  .wrap {
    position: relative;
    height: 100%;
    padding: 78px 88px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 30px;
  }

  .brand { display: flex; align-items: center; gap: 24px; }
  .logo {
    width: 96px; height: 96px; border-radius: 28px;
    background: linear-gradient(135deg, #0a84ff, #bf5af2 55%, #ff375f);
    box-shadow: 0 22px 60px rgba(10, 132, 255, .42);
    display: grid; place-items: center;
  }
  .logo svg { width: 52px; height: 52px; }
  .eyebrow { font-size: 24px; letter-spacing: 4px; color: #83838c; text-transform: uppercase; font-weight: 600; }

  h1 { font-size: 92px; line-height: 1.08; letter-spacing: -3px; font-weight: 700; }
  h1 em { font-style: normal; background: linear-gradient(100deg, #4da3ff, #bf5af2 55%, #ff5c7a); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .sub { font-size: 32px; color: #b9b9c0; letter-spacing: .5px; }

  .chips { display: flex; gap: 14px; margin-top: 6px; }
  .chip {
    font-size: 24px; color: #d6d6dd;
    padding: 12px 26px; border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .14);
    background: rgba(255, 255, 255, .045);
  }
  .chip.hot { color: #fff; border-color: transparent; background: linear-gradient(135deg, #0a84ff, #7b5cff); }

  .foot {
    position: absolute; left: 88px; right: 88px; bottom: 54px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 22px; color: #83838c;
  }
  .foot .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: #30d158; margin-right: 10px; }
</style>
</head>
<body>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>

  <div class="wrap">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round">
          <path d="M5 19V9" /><path d="M12 19V5" /><path d="M19 19v-6" />
        </svg>
      </div>
      <div class="eyebrow">GitHub Rankings</div>
    </div>

    <h1>开源趋势<em>榜单</em></h1>
    <div class="sub">总榜 · 新星榜 · 热门榜，每天自动更新</div>

    <div class="chips">
      <span class="chip hot">近 7 天 Star 增量</span>
      <span class="chip">13 个语言分榜</span>
      <span class="chip">RSS / JSON API</span>
    </div>
  </div>

  <div class="foot">
    <span><span class="dot"></span>每日 09:17 更新</span>
    <span>z324169276.github.io/github-rankings</span>
  </div>
</body>
</html>
