name: probe-raw
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe raw.githubusercontent.com
        run: |
          node --input-type=module - <<'EOF'
          const repos = ['ollama/ollama', 'facebook/react', 'langchain-ai/langchain', 'vercel/next.js', 'microsoft/vscode'];

          async function probe(label, url, headers) {
            const t = Date.now();
            try {
              const r = await fetch(url, { headers: { 'User-Agent': 'github-rankings', ...headers }, signal: AbortSignal.timeout(8000) });
              let len = 0;
              if (r.ok) len = (await r.text()).length;
              else await r.text();
              console.log(
                label.padEnd(30),
                'status=' + r.status,
                (Date.now() - t) + 'ms',
                'len=' + len,
                'ct=' + (r.headers.get('content-type') || '-'),
                'rl=' + (r.headers.get('x-ratelimit-remaining') || '-'),
                'ra=' + (r.headers.get('retry-after') || '-'),
                'final=' + (r.url === url ? 'same' : r.url.slice(0, 70))
              );
            } catch (e) {
              console.log(label.padEnd(30), 'ERR', (Date.now() - t) + 'ms', (e.cause && (e.cause.code || e.cause.message)) || e.message);
            }
          }

          for (const full of repos) {
            await probe(full + ' HEAD noRange', 'https://raw.githubusercontent.com/' + full + '/HEAD/README.md', {});
            await probe(full + ' HEAD range', 'https://raw.githubusercontent.com/' + full + '/HEAD/README.md', { Range: 'bytes=0-60000' });
            await probe(full + ' main noRange', 'https://raw.githubusercontent.com/' + full + '/main/README.md', {});
          }

          console.log('--- concurrent 12 (HEAD + Range, as build does) ---');
          const many = Array.from({ length: 12 }, (_, i) => 'https://raw.githubusercontent.com/' + repos[i % repos.length] + '/HEAD/README.md');
          const res = await Promise.all(
            many.map((u) =>
              fetch(u, { headers: { 'User-Agent': 'github-rankings', Range: 'bytes=0-60000' }, signal: AbortSignal.timeout(10000) })
                .then((r) => r.status)
                .catch((e) => 'ERR:' + ((e.cause && (e.cause.code || e.cause.message)) || e.message))
            )
          );
          console.log('concurrent12:', JSON.stringify(res));
          EOF
