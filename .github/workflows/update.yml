name: 更新榜单数据

on:
  schedule:
    # 每天 01:17 UTC（北京时间 09:17）
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取 GitHub 数据
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node server/refresh.js

      - name: 构建静态站
        run: node scripts/build-static.mjs

      - name: 提交数据快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/db.json
          if git diff --staged --quiet; then
            echo "数据无变化"
          else
            git commit -m "chore: 更新榜单数据 $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4

      # jsDelivr 会自动给 GitHub 仓库加 CORS 头，但只认仓库里的文件。
      # 这里把 API 产物推到一个每天强制覆盖的 data 分支，避免历史无限膨胀。
      - name: 同步 jsDelivr 镜像分支
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf "$RUNNER_TEMP/mirror"
          mkdir -p "$RUNNER_TEMP/mirror"
          cp -r dist/api "$RUNNER_TEMP/mirror/api"
          cp -r dist/feed "$RUNNER_TEMP/mirror/feed"
          cp dist/feed.xml "$RUNNER_TEMP/mirror/feed.xml"
          cd "$RUNNER_TEMP/mirror"
          git init -q
          git checkout -q -b data
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
