name: 更新榜单数据

on:
  schedule:
    # 每天 01:17 UTC（北京时间 09:17）
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 历史快照不存在 main 上，否则每次提交都存一份完整 JSON，仓库会持续膨胀。
      # 改为从 data 分支取回上一次的快照。
      - name: 恢复历史快照
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git checkout FETCH_HEAD -- data/db.json || true
            echo "已恢复 $(wc -c < data/db.json 2>/dev/null || echo 0) 字节历史快照"
          else
            echo "首次运行，无历史快照"
          fi

      - name: 抓取 GitHub 数据
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node server/refresh.js

      - name: 构建静态站
        run: node scripts/build-static.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4

      # data 分支同时承担两件事：jsDelivr 镜像 + 历史快照存储。
      # 每次强制覆盖成单个提交，仓库体积只取决于单次快照大小，不随天数增长。
      - name: 同步 data 分支（镜像 + 快照）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf "$RUNNER_TEMP/mirror"
          mkdir -p "$RUNNER_TEMP/mirror/data"
          cp -r dist/api "$RUNNER_TEMP/mirror/api"
          cp -r dist/feed "$RUNNER_TEMP/mirror/feed"
          cp dist/feed.xml "$RUNNER_TEMP/mirror/feed.xml"
          cp data/db.json "$RUNNER_TEMP/mirror/data/db.json"
          cd "$RUNNER_TEMP/mirror"
          git init -q
          git checkout -q -b data
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      # 失败时开 issue，避免每天定时任务静默失效没人发现
      - name: 失败时创建 issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const title = `[自动] 榜单数据更新失败 ${date}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            if (open.data.some((issue) => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                '定时更新失败，站点仍在提供上一版数据。',
                '',
                `运行记录：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '常见原因：GitHub API 限流、网络超时、构建报错。修复后请关闭本 issue。',
              ].join('\n'),
            });
