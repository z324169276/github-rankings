<script id="post-data" type="application/json">
{
  "title": "翻了 1456 个 GitHub 项目，只有这 4 个能一个人做",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年11月16日 00:39",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">这两天我把手上那份 GitHub 榜单重新翻了一遍。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">1456 个项目，热榜抓下来的，每个都带星标、fork 数、最近推送时间。翻到后面我有点意外。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\"><strong style=\"color:#1a1a1a;\">榜上最火的项目，和一个人真能接住的项目，几乎是两批。</strong></p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">七万星的 IDE、五万星的浏览器内核，看着眼热，但你拿不动。工程量、维护成本、生态位，全都不是一个人能碰的。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">所以我把口径收紧了一点。许可证得能商用，半年内得还有人在推，星标一千以上但不能是那种巨无霸，再加上一条很多榜单不会写的，把破解、越狱、去授权这类项目直接剔掉。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">筛完剩 745 个。再挑出这 4 个。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 34px;\">它们有个共同点，<span style=\"background:#fff3d6;padding:1px 4px;\">不需要你做产品创新，只需要你把别人做好的东西，接到一个具体的人身上。</span></p>\n\n<p style=\"font-size:17px;font-weight:bold;color:#1a1a1a;margin:0 0 6px;line-height:1.5;\"><span style=\"display:inline-block;width:4px;height:17px;background:#c0392b;vertical-align:-3px;margin-right:10px;\"></span>01　让 Agent 真的会剪视频</p>\n<p style=\"font-size:14px;color:#999;margin:0 0 18px;\">ffmpeg-skill　5170★　439 fork　MIT</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">这是一个把 FFmpeg 能力封装成工具契约的项目，42 个工具，带 MCP Server。Claude Code、Cursor、Codex 都能直接调。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">剪、裁、加字幕、抽帧、转码，全在本地跑，不用上传。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">它自己不是产品，是个零件。真正值钱的地方在这里，<strong style=\"color:#1a1a1a;\">你把它封成一个具体场景的一键工具，它就变成产品了</strong>。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">比如口播视频，固定做三件事，去停顿、上字幕、切三个竖版尺寸。做成一个按钮，卖给做知识口播的人。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">技术难度不高，但客户能一眼看懂效果。这类东西卖 99 到 299 的一次性买断，是有人买的。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">要注意的是，纯本地工具很容易被白嫖。壁垒不在功能，在模板和易用性。你得多做几个行业预设，让人懒得自己配。</p>\n\n<p style=\"font-size:17px;font-weight:bold;color:#1a1a1a;margin:38px 0 6px;line-height:1.5;\"><span style=\"display:inline-block;width:4px;height:17px;background:#c0392b;vertical-align:-3px;margin-right:10px;\"></span>02　自动找热点、自动写日报</p>\n<p style=\"font-size:14px;color:#999;margin:0 0 18px;\">AIHOT　10462★　2436 fork　MIT</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">一个完整的行业热点站框架。抓信源、去重、用模型精选、生成日报，Docker Compose 一键起来。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">作者在 README 里写得很直白，把信源和精选标准换成你的，它就是你的行业热点站。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">这句话其实已经把商业模式说完了。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\"><strong style=\"color:#1a1a1a;\">通用 AI 日报已经烂大街了。但垂直行业的情报，还很空。</strong></p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">医疗器械招标、跨境物流政策、地方产业补贴，这些东西没人做成日报，因为做的人不懂行。你要是懂，信源就是护城河。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">收钱方式也简单，行业情报订阅，一年 99 到 499。或者干脆卖给企业，做内部情报系统，一单几千到几万。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">风险在于版权和同质化。内容必须改写，不能原文搬。而且一旦有人用同样的框架做同一个行业，你就只剩信源质量这一条命。</p>\n\n<p style=\"font-size:17px;font-weight:bold;color:#1a1a1a;margin:38px 0 6px;line-height:1.5;\"><span style=\"display:inline-block;width:4px;height:17px;background:#c0392b;vertical-align:-3px;margin-right:10px;\"></span>03　把成熟系统卖给小公司</p>\n<p style=\"font-size:14px;color:#999;margin:0 0 18px;\">kanboard　9956★　2028 fork　MIT</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">看板项目管理，2014 年活到现在，还在推。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">这个项目本身没什么新鲜的。但它代表了一类生意，很多人忽略了。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\"><strong style=\"color:#1a1a1a;\">不是所有客户都想用 SaaS。有一批小公司，数据不能出自己机房。</strong></p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">十个到五十人的公司，买不起大厂方案，又不放心把项目数据放公有云。他们要的就是一个能装在自己服务器上的看板。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">你的活是部署、配 HTTPS、配备份、接企业微信通知。技术含量不高，但客户自己搞不定。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">一次部署收两千到五千，年度运维再收一千到三千。成交靠信任，不靠流量，所以特别适合没有粉丝的人。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">同类的还有 wallabag 做资料归档、Krayin 做 CRM、ntfy 做推送。这四个凑一起，就是一个完整的私有化交付工具箱。</p>\n\n<p style=\"font-size:17px;font-weight:bold;color:#1a1a1a;margin:38px 0 6px;line-height:1.5;\"><span style=\"display:inline-block;width:4px;height:17px;background:#c0392b;vertical-align:-3px;margin-right:10px;\"></span>04　把别人的爆款，拆开看</p>\n<p style=\"font-size:14px;color:#999;margin:0 0 18px;\">rea-video　7321★　1078 fork　Apache-2.0</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">这个项目做的事挺狠。把一个视频拆成逐个镜头，判断这个镜头是实拍、AI 生成还是代码做的，然后输出可复刻的结构化文件。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">上线不到三周，七千多星。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">但它解决的是生产，不是诊断。而投放团队最疼的地方，恰恰是诊断。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">一条素材为什么能跑量，我该怎么复刻。这个问题现在还是靠人肉看、凭感觉猜。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">所以你可以做的是拆解服务，不是拆解工具。客户发一条视频过来，二十四小时出一份报告，分镜表、钩子类型、节奏结构、复刻方案。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">单条五十到两百，十条件包八百到一千五。前期人工交付，跑通再接系统。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">有一条红线得说清楚。<span style=\"background:#fff3d6;padding:1px 4px;\">只处理客户自己给的素材，不做下载、不做去水印、不做搬运洗稿。</span>这三件事来钱快，但会让整个生意一次性归零。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:38px 0 18px;\">把四个放一起看，数字是这样的。</p>\n\n<table style=\"width:100%;border-collapse:collapse;margin:0 0 10px;font-size:13px;color:#333;\">\n  <tr>\n    <th style=\"border:1px solid #e2e2e2;background:#f7f7f7;padding:9px 8px;text-align:left;font-weight:bold;color:#1a1a1a;\">项目</th>\n    <th style=\"border:1px solid #e2e2e2;background:#f7f7f7;padding:9px 8px;text-align:right;font-weight:bold;color:#1a1a1a;\">星标</th>\n    <th style=\"border:1px solid #e2e2e2;background:#f7f7f7;padding:9px 8px;text-align:right;font-weight:bold;color:#1a1a1a;\">fork</th>\n    <th style=\"border:1px solid #e2e2e2;background:#f7f7f7;padding:9px 8px;text-align:left;font-weight:bold;color:#1a1a1a;\">许可证</th>\n  </tr>\n  <tr>\n    <td style=\"border:1px solid #e2e2e2;padding:9px 8px;\">ffmpeg-skill</td>\n    <td style=\"border:1px solid #e2e2e2;padding:9px 8px;text-align:right;\">5170</td>\n    <td style=\"border:1px solid #e2e2e2;padding:9px 8px;text-align:right;\">439</td>\n    <td style=\"border:1px solid #e2e2e2;padding:9px 8px;\">MIT</td>\n  </tr>\n  <tr>\n    <td style=\"border:1px solid #e2e2e2;padding:9px 8px;background:#fbfbfb;\">AIHOT</td>\n    <td style=\"border:1px solid #e2e2e2;padding:9px 8px;text-align:right;background:#fbfbfb;\">10462</td>\n    <td style=\"border:1px solid #e2e2e2;padding:9px 8px;text-align:right;background:#fbfbfb;\">2436</td>\n    <td style=\"border:1px solid #e2e2e2;padding:9px 8px;background:#fbfbfb;\">MIT</td>\n  </tr>\n  <tr>\n    <td style=\"border:1px solid #e2e2e2;padding:9px 8px;\">kanboard</td>\n    <td style=\"border:1px solid #e2e2e2;padding:9px 8px;text-align:right;\">9956</td>\n    <td style=\"border:1px solid #e2e2e2;padding:9px 8px;text-align:right;\">2028</td>\n    <td style=\"border:1px solid #e2e2e2;padding:9px 8px;\">MIT</td>\n  </tr>\n  <tr>\n    <td style=\"border:1px solid #e2e2e2;padding:9px 8px;background:#fbfbfb;\">rea-video</td>\n    <td style=\"border:1px solid #e2e2e2;padding:9px 8px;text-align:right;background:#fbfbfb;\">7321</td>\n    <td style=\"border:1px solid #e2e2e2;padding:9px 8px;text-align:right;background:#fbfbfb;\">1078</td>\n    <td style=\"border:1px solid #e2e2e2;padding:9px 8px;background:#fbfbfb;\">Apache-2.0</td>\n  </tr>\n</table>\n<p style=\"font-size:13px;color:#999;line-height:1.6;margin:0 0 30px;\">数据取自 2026 年 11 月 16 日的公开快照，星标会变，判断不会。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">这张表里我最在意的不是星标，是第四行那个 fork 数。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\"><strong style=\"color:#c0392b;\">1078 除以 7321，14.7%。这个比例在开源项目里算很高的。</strong></p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">星标是收藏，fork 是动手。一个人收藏一个项目，可能只是觉得有意思。一个人 fork 一个项目，多半是真打算改它、用它、拿它做点什么。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">换句话说，<span style=\"background:#fff3d6;padding:1px 4px;\">这个方向上已经有人在动手了，但还没人把它做成生意。</span></p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">这个时间差，就是个人的机会窗口。等有人做成了 SaaS，窗口就关了。</p>\n\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">最后说一句可能不太中听的。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">这四个项目，代码都是免费的，谁都能下载。你卖出去的从来不是代码。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">你卖的是客户看不懂的那部分。是他不知道 FFmpeg 怎么调参数，不知道哪个信源值得订阅，不知道服务器怎么配证书，不知道一条视频为什么能跑量。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">信息差从来不是靠藏，是靠把别人不愿意花时间搞明白的东西，认真搞明白。</p>\n<p style=\"font-size:16px;line-height:1.8;color:#333;margin:0 0 34px;\">这句话听着鸡汤。但你真去做一单，就知道它是账。</p>\n\n<p style=\"text-align:center;font-size:13px;letter-spacing:4px;color:#c0392b;margin:0 0 10px;\">· · ·</p>\n<p style=\"text-align:center;font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\">完整榜单我整理成了文档</p>\n<p style=\"text-align:center;font-size:16px;line-height:1.8;color:#333;margin:0 0 22px;\"><strong style=\"color:#1a1a1a;\">13 个项目，分四组，每个都写了切入点和收钱方式</strong></p>\n<p style=\"text-align:center;font-size:15px;line-height:1.8;color:#666;margin:0 0 20px;\">另外附一份付费报告的结构样例，讲清楚一个方向怎么从 0 做到第一单</p>\n<p style=\"text-align:center;margin:0 0 26px;\"><span style=\"display:inline-block;background:#c0392b;color:#ffffff;font-size:15px;font-weight:bold;padding:11px 30px;border-radius:6px;\">公众号后台回复「榜单」领取</span></p>\n<p style=\"text-align:center;font-size:13px;line-height:1.7;color:#999;margin:0 0 8px;\">榜单每两周更新一次，只挑一个人能接住的</p>\n<p style=\"text-align:center;font-size:13px;line-height:1.7;color:#999;margin:0 0 8px;\">觉得有用，转给那个总在问「现在做什么好」的朋友</p>\n"
}
</script>

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
